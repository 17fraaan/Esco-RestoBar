<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="../">
  <title>Entradas - Esco Restobar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header>
      <div class="brand" aria-label="Logo Esco Restobar">
        <img class="logo" src="assets/logo-restobar.png" alt="Logo Esco Restobar">
        <span class="header-divider" aria-hidden="true"></span>
        <div>
          <h1>Entradas</h1>
          <p class="lead"><a class="tag-pill" href="index.html">← Volver al menú</a></p>
        </div>
      </div>
    </header>

    <section aria-label="Entradas" class="products">
      <div class="section-title">Productos</div>
      <div class="product-list">
        <div class="product-item">
          <span class="product-name">Cazuela de albóndigas</span>
          <span class="product-price">$6.000</span>
        </div>
        <div class="product-item">
          <span class="product-name">Cazuela de salchichas</span>
          <span class="product-price">$6.000</span>
        </div>
        <div class="product-item">
          <span class="product-name">Cazuela de milanesa</span>
          <span class="product-price">$10.000</span>
        </div>
        <div class="product-item">
          <span class="product-name">Cazuela de aceitunas</span>
          <span class="product-price">$5.000</span>
        </div>
        <div class="product-item">
          <span class="product-name">Plato de queso</span>
          <span class="product-price">$6.000</span>
        </div>
        <div class="product-item">
          <span class="product-name">Plato de salame</span>
          <span class="product-price">$6.000</span>
        </div>
      </div>
    </section>

    <footer class="footer">
      © 2026 Todos los derechos reservados - Francisco Vilches
    </footer>
  </main>
</body>
</html>
