<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastas - Esco Restobar</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <header>
      <div class="brand" aria-label="Logo Esco Restobar">
        <img class="logo" src="/assets/logo-restobar.png" alt="Logo Esco Restobar">
        <span class="header-divider" aria-hidden="true"></span>
        <div>
          <h1>Pastas</h1>
          <p class="lead"><a class="tag-pill" href="/">← Volver al menú</a></p>
        </div>
      </div>
    </header>

    <section aria-label="Salsas disponibles">
      <div class="section-title">Salsas disponibles</div>
      <div class="toolbar">
        <span class="tag-pill">MIXTA</span>
        <span class="tag-pill">BOLOGNESA</span>
        <span class="tag-pill">PARISIENNE</span>
        <span class="tag-pill">ROQUEFORT</span>
      </div>
    </section>

    <section aria-label="Productos" class="products">
      <div class="section-title">Productos</div>
      <div class="product-list">
        <div class="product-item">
          <span class="product-name">Ravioles</span>
          <span class="product-price">$15.000</span>
        </div>
        <div class="product-item">
          <span class="product-name">Tallarines</span>
          <span class="product-price">$12.000</span>
        </div>
        <div class="product-item">
          <span class="product-name">Ñoquis</span>
          <span class="product-price">$12.000</span>
        </div>
      </div>
    </section>

    <footer class="footer">
      © 2026 Todos los derechos reservados - Francisco Vilches
    </footer>
  </main>
</body>
</html>
