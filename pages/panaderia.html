<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panadería - Esco Restobar</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <header>
      <div class="brand" aria-label="Logo Esco Restobar">
        <img class="logo" src="/assets/escobarrrr_1.png" alt="Logo Esco Restobar">
        <span class="header-divider" aria-hidden="true"></span>
        <div>
          <h1>Panadería</h1>
          <p class="lead"><a class="tag-pill" href="/index.html">← Volver al menú</a></p>
        </div>
      </div>
    </header>

    <section aria-label="Productos de panadería" class="products">
      <div class="section-title">Productos</div>
      <div class="product-list">
        <div class="product-item">
          <span class="product-name">Medialunas</span>
          <span class="product-price">$1.000</span>
        </div>
        <div class="product-item">
          <span class="product-name">Facturas</span>
          <span class="product-price">$1.500</span>
        </div>
        <div class="product-item">
          <span class="product-name">Mafaldas</span>
          <span class="product-price">$3.500</span>
        </div>
        <div class="product-item">
          <span class="product-name">Tostadas</span>
          <span class="product-price">$1.500</span>
        </div>
        <div class="product-item">
          <span class="product-name">Tostados</span>
          <span class="product-price">$7.500</span>
        </div>
        <div class="product-item">
          <span class="product-name">Alfajores</span>
          <span class="product-price">$2.500</span>
        </div>
        <div class="product-item">
          <span class="product-name">Porción individual (queso crema, mermelada, manteca, dulce de leche)</span>
          <span class="product-price">$400 c/u</span>
        </div>
      </div>
    </section>

    <footer class="footer">
      © 2026 Todos los derechos reservados - Francisco Vilches
    </footer>
  </main>
</body>
</html>
